[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemonitor"
version = "0.2.0"
description = "TeleMonitor research code: labelling, quality, windows, features, benchmark of risk models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["catboost>=1.2", "optuna>=4", "torch>=2.1", "xgboost>=2"]   # xgboost: earlier pipeline only
serve = ["fastapi>=0.110", "uvicorn>=0.29", "joblib>=1.3", "httpx>=0.25"]
worker = ["firebase-admin>=6.5"]   # server functions (serve/worker.py); install in a virtual environment

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
