# Server functions — thesis ch.4, Table "Server functions specified" (tab:triggers).
# Run locally: python -m telemonitor.serve.worker --credentials <service-account.json>

status: provisional            # delays set with the partner physician, like the tier cut-points
interval_seconds: 60           # one cycle of every function
quality_window_days: 30        # series used to flag a new reading (robust z needs the patient's history)
default_checkup_period_days: 3 # app default (queue_logic.dart); a clinician may set 1-30 per patient
# Older readings and events are flagged or marked, never escalated or notified:
# the first cycle must not flood the queue with the backlog.
max_age_hours: 24
# A patient who stays silent is reminded again at this interval (decision flow: "repeated
# reminders"); the non-transmission event stays open until the clinician closes it.
reminder_interval_hours: 24
# Messages: the recipient is notified of a message still unread this long after it
# arrived. An open conversation reads it at once, so it brings no notification.
message_delay_seconds: 20
# "Forgot password?" is asked signed out, so anyone may ask for any address: at most
# this many reset emails per account in 24 h (the rules allow one request a minute).
password_resets_per_day: 5

# Queue-age sweep: an open event older than this is escalated to the clinician's
# named alternate (alternateClinicianId on the clinician's profile) and re-notified.
queue_age_hours:
  red: 4
  yellow: 72

# Notification by level and recipient (ch.4, Table "Notification by level").
# The patient is never told to change a dose (ch.4 §Safety boundary).
notify:
  red:
    patient: "Your last reading is in the red zone. Seek care today at your health centre or hospital."
    clinician: "Red alert: {pseudonym}, {trigger}"
  yellow:
    patient: "Your last reading is above your home target. Please do the check shown in the app: more readings over the next days."
    clinician: null              # queued at normal priority, no notification
  non_transmission:
    patient: "We have not received a reading from you for {days} days. Please measure and log a reading."
  escalation:
    clinician: "Unreviewed alert for {pseudonym} since {age} h ({tier})"
  verdict:
    patient: "Your clinician has reviewed your alert of {date}."
  # Who wrote, never what: a notification shows on a locked screen. One message, then several.
  message:
    patient: ["New message from your clinician", "{count} new messages from your clinician"]
    clinician: ["New message from {pseudonym}", "{count} new messages from {pseudonym}"]
  titles:
    alert: "TeleMonitor alert"
    escalation: "TeleMonitor escalation"
  tiers: {green: green, yellow: yellow, red: red}

# The same in French, for a user who chose French in the app (users/{uid}.language).
# Who receives a notification is decided by `notify` above; this gives only the words.
notify_fr:
  red:
    patient: "Votre dernière mesure est dans la zone rouge. Rendez-vous aujourd'hui à votre centre de santé ou à l'hôpital."
    clinician: "Alerte rouge : {pseudonym}, {trigger}"
  yellow:
    patient: "Votre dernière mesure est au-dessus de votre objectif à domicile. Faites le contrôle indiqué dans l'application : d'autres mesures dans les prochains jours."
    clinician: null
  non_transmission:
    patient: "Nous n'avons reçu aucune mesure de votre part depuis {days} jours. Veuillez mesurer et enregistrer une mesure."
  escalation:
    clinician: "Alerte non examinée pour {pseudonym} depuis {age} h ({tier})"
  verdict:
    patient: "Votre clinicien a examiné votre alerte du {date}."
  message:
    patient: ["Nouveau message de votre clinicien", "{count} nouveaux messages de votre clinicien"]
    clinician: ["Nouveau message de {pseudonym}", "{count} nouveaux messages de {pseudonym}"]
  titles:
    alert: "Alerte TeleMonitor"
    escalation: "Alerte TeleMonitor transmise"
  tiers: {green: vert, yellow: jaune, red: rouge}
